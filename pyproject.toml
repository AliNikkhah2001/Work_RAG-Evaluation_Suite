[project]
name = "work-rag-evaluation"
version = "0.1.0"
description = "Work Credit RAG evaluation suite — multi-turn subspace + retrieval Hit@k"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27.0",
  "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
